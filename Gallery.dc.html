<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/broadsheet-ee791a6a-79e3-4771-8e39-c7d5b79152d8/styles.css">
  <script src="_ds/broadsheet-ee791a6a-79e3-4771-8e39-c7d5b79152d8/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; background: var(--color-bg); }
    a { color: var(--color-accent-700); text-decoration: underline; }
    a:hover { color: var(--color-accent-900); }
  </style>
</helmet>
<div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 72px) var(--space-8);">

  <nav class="nav" style="padding-inline: 0;">
    <span class="nav-brand">Tahoma Junior Bears</span>
    <a href="Landing.dc.html" style="text-decoration: none;">Home</a>
    <span style="font-family: var(--font-body); font-size: 14px; color: var(--color-neutral-700);">Signed in as Morgan R.</span>
    <a href="Sign-in.dc.html" style="text-decoration: none;">Sign out</a>
  </nav>

  <section style="padding: var(--space-6) 0 var(--space-4);">
    <h1 style="font-family: var(--font-heading); font-weight: 700; font-size: 40px; line-height: 1.1; margin: 0; color: var(--color-text);">Team Photo Archive</h1>
    <p style="font-family: var(--font-body); font-style: italic; font-size: 17px; margin: var(--space-2) 0 0; color: var(--color-neutral-700);">3rd Grade &middot; 2026&ndash;2027 Season</p>
  </section>

  <section style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) 0; border-top: 1px solid var(--color-neutral-300); border-bottom: 1px solid var(--color-neutral-300);">
    <div class="seg" role="tablist" aria-label="Filter photos">
      <button type="button" class="seg-opt" aria-selected="{{ isAll }}" onclick="{{ setFilterAll }}">All team photos</button>
      <button type="button" class="seg-opt" aria-selected="{{ isMine }}" onclick="{{ setFilterMine }}">My player only</button>
    </div>
    <button type="button" class="btn btn-secondary">Download all shown ({{ visibleCount }})</button>
  </section>

  <sc-for list="{{ games }}" as="game" hint-placeholder-count="2">
    <section style="padding: var(--space-6) 0;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-4);">
        <div>
          <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 24px; margin: 0;">{{ game.label }}</h2>
          <p style="font-family: var(--font-body); font-size: 14px; color: var(--color-neutral-700); margin: var(--space-1) 0 0;">{{ game.date }} &middot; {{ game.photoCount }} photos</p>
        </div>
        <button type="button" class="btn btn-ghost">Download this game</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-4);">
        <sc-for list="{{ game.visiblePhotos }}" as="photo" hint-placeholder-count="4">
          <div style="position: relative;">
            <div class="halftone" style="aspect-ratio: 4/3;">
              <image-slot id="{{ photo.id }}" shape="rect" placeholder="{{ photo.caption }}"></image-slot>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-2);">
              <span style="font-family: var(--font-body); font-size: 13px; color: var(--color-neutral-700);">{{ photo.caption }}</span>
              <sc-if value="{{ photo.mine }}" hint-placeholder-val="{{ false }}">
                <span class="tag tag-accent-2">#7</span>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'all' };

  gamesData = [
    { id: 'g1', label: 'vs. Eastside Elks', date: 'Sept 20, 2026', photos: [
      { id: 'g1p1', caption: 'Opening kickoff', mine: false },
      { id: 'g1p2', caption: '#7 breaks a tackle', mine: true },
      { id: 'g1p3', caption: 'Sideline huddle', mine: false },
      { id: 'g1p4', caption: '#7 makes a catch', mine: true },
      { id: 'g1p5', caption: 'Post-game handshake', mine: false },
    ]},
    { id: 'g2', label: 'vs. Riverbend Hawks', date: 'Sept 27, 2026', photos: [
      { id: 'g2p1', caption: 'Team warm-up', mine: false },
      { id: 'g2p2', caption: '#7 on defense', mine: true },
      { id: 'g2p3', caption: 'Coach talks strategy', mine: false },
      { id: 'g2p4', caption: 'End zone celebration', mine: false },
    ]},
  ];

  renderVals() {
    const mineOnly = this.state.filter === 'mine';
    const games = this.gamesData.map(g => {
      const visiblePhotos = mineOnly ? g.photos.filter(p => p.mine) : g.photos;
      return { ...g, visiblePhotos, photoCount: visiblePhotos.length };
    }).filter(g => g.visiblePhotos.length > 0);
    const visibleCount = games.reduce((sum, g) => sum + g.visiblePhotos.length, 0);
    return {
      isAll: this.state.filter === 'all',
      isMine: mineOnly,
      setFilterAll: () => this.setState({ filter: 'all' }),
      setFilterMine: () => this.setState({ filter: 'mine' }),
      games,
      visibleCount,
    };
  }
}

</script>
</body>
</html>
